name: release

# Cutting a release is: tag it, push the tag.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Everything below is what `brew install kibitz` needs in order to pour a
# prebuilt app rather than compile one on someone else's machine. The formula
# lives in this repository, at Formula/kibitz.rb, and this workflow rewrites it
# on every release, so there is no second repository to keep in step.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      # Full history, because the last step commits the formula back onto main
      # and a tag checkout is detached.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: meta
        name: Work out the version and the URLs
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "version=$VERSION"
            echo "url=https://github.com/${{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
            echo "root=https://github.com/${{ github.repository }}/releases/download/${GITHUB_REF_NAME}"
          } >> "$GITHUB_OUTPUT"

      # Nothing gets a tag that cannot pass its own suite.
      - name: Test
        run: ./scripts/test.sh

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

      - id: source
        name: Checksum the source tarball
        run: |
          set -euo pipefail
          curl -fsSL -o source.tar.gz "${{ steps.meta.outputs.url }}"
          echo "sha=$(shasum -a 256 source.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      # A bottle can only be built from a formula, so the formula comes first,
      # without a bottle block, purely so Homebrew has something to build.
      - name: Set up a scratch tap to build in
        run: |
          set -euo pipefail
          brew tap-new k-napiontek/scratch --no-git
          python3 packaging/render-formula.py \
            --version "${{ steps.meta.outputs.version }}" \
            --url "${{ steps.meta.outputs.url }}" \
            --sha256 "${{ steps.source.outputs.sha }}" \
            > "$(brew --repository k-napiontek/scratch)/Formula/kibitz.rb"

      - name: Build the bottle
        run: |
          set -euo pipefail
          brew install --build-bottle k-napiontek/scratch/kibitz
          brew bottle --json --no-rebuild \
            --root-url="${{ steps.meta.outputs.root }}" \
            k-napiontek/scratch/kibitz

      # `brew bottle` writes kibitz--0.2.0..., with two hyphens, but `brew
      # install` asks the server for kibitz-0.2.0..., with one. Uploading the
      # file under the name it was written with produces a 404 for every user
      # and no error anywhere else. Both names are in the JSON, so take them
      # from there rather than reimplementing the rule.
      - name: Upload the bottle under the name Homebrew will ask for
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          JSON="$(ls ./*.bottle.json)"
          python3 - "$JSON" <<'PY'
          import json, pathlib, sys
          tags = next(iter(json.load(open(sys.argv[1])).values()))["bottle"]["tags"]
          for meta in tags.values():
              pathlib.Path(meta["local_filename"]).rename(meta["filename"])
              print(f"{meta['local_filename']} -> {meta['filename']}")
          PY
          gh release upload "$GITHUB_REF_NAME" ./*.bottle.tar.gz

      # Onto main, not onto the tag: a tap serves whatever is at the default
      # branch, so this is what anyone tapping this repository will resolve.
      # No token beyond the built-in one, because the formula lives here.
      - name: Commit the formula
        run: |
          set -euo pipefail
          python3 packaging/render-formula.py \
            --version "${{ steps.meta.outputs.version }}" \
            --url "${{ steps.meta.outputs.url }}" \
            --sha256 "${{ steps.source.outputs.sha }}" \
            --bottle-json "$(ls ./*.bottle.json)" \
            > "$RUNNER_TEMP/kibitz.rb"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B main origin/main
          mkdir -p Formula
          cp "$RUNNER_TEMP/kibitz.rb" Formula/kibitz.rb
          git add Formula/kibitz.rb
          # Re-running a release that changed nothing should not make an empty commit.
          if git diff --staged --quiet; then
            echo "formula unchanged"
          else
            git commit -m "chore: kibitz ${{ steps.meta.outputs.version }}"
            git push origin main
          fi

          {
            echo '## Formula'
            echo '```ruby'
            cat Formula/kibitz.rb
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
